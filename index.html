<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1020;
  color: white;
}
header {
  background: #6d28d9;
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}
.subtitle {
  text-align: center;
  color: #c4b5fd;
  padding: 12px;
}
#chat {
  max-width: 750px;
  height: 60vh;
  overflow-y: auto;
  margin: 10px auto;
  padding: 15px;
}
.message {
  padding: 12px 15px;
  border-radius: 14px;
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.bot {
  background: #24243a;
  margin-right: 12%;
}
.user {
  background: #5b21b6;
  margin-left: 12%;
}
.controls {
  display: flex;
  gap: 8px;
  max-width: 750px;
  margin: 10px auto;
  padding: 10px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #1c1c30;
  color: white;
  font-size: 16px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  background: #7c3aed;
  color: white;
  font-size: 16px;
}
footer {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  padding: 15px;
}
</style>
</head>
<body>
<header>💜 Echo AI</header>
<div class="subtitle">Your little corner of AI</div>

<div id="chat" aria-live="polite">
  <div class="message bot">Echo AI: Hi! Welcome to Echo AI. Ask me something!</div>
</div>

<div class="controls">
  <input id="question" placeholder="Type your message..." autocomplete="off">
  <button id="send">Send</button>
</div>
<footer>Echo AI Preview · Version 0.1</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

function addMessage(text, who) {
  const bubble = document.createElement("div");
  bubble.className = "message " + who;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function getReply(text) {
  const q = text.toLowerCase();

  if (/\b(hi|hello|hey)\b/.test(q)) {
    return "Hello! 💜 I'm Echo AI. How can I help you?";
  }
  if (q.includes("your name") || q.includes("who are you")) {
    return "I'm Echo AI, your personal chatbot project!";
  }
  if (q.includes("joke")) {
    return "Why did the computer go to the doctor? It caught a virus! 😄";
  }
  if (q.includes("help")) {
    return "I'll do my best! Ask me a question, say hello, or ask me for a joke.";
  }
  if (q.includes("time")) {
    return "You can check the current time on your tablet's status bar.";
  }
  if (q.includes("thank")) {
    return "You're welcome! 💜";
  }
  return "I'm still a beginner chatbot, so I don't know how to answer that yet. In a future version, we can try adding a real AI model that runs on your device.";
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage("You: " + text, "user");
  input.value = "";
  const reply = getReply(text);
  setTimeout(() => addMessage("Echo AI: " + reply, "bot"), 250);
  input.focus();
}

document.getElementById("send").addEventListener("click", sendMessage);
input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
